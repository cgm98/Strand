name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  security:
    name: Seguridad (cargo-audit + cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: cargo-audit (vulnerabilidades conocidas en Cargo.lock)
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          file: src-tauri/Cargo.lock

      - name: cargo-deny (advisories, licencias, bans, sources)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: src-tauri/Cargo.toml

  backend:
    name: Backend (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias de sistema de Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Rust estable + clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache de cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: cargo clippy (sin avisos)
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        working-directory: src-tauri
        run: cargo test

  frontend:
    name: Frontend (Vue + TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Bun
        uses: oven-sh/setup-bun@v2

      - name: Instalar dependencias
        run: bun install --frozen-lockfile

      - name: Tipos (vue-tsc) y build de producción
        run: bun run build

      - name: ESLint
        run: bun run lint

      - name: Prettier (solo verificación, no reescribe nada)
        run: bun run format:check

      - name: Tests (bun test + jsdom)
        run: bun test
