# Config de cargo-deny para Strand.
# Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = false
no-default-features = false

[advisories]
yanked = "deny"
# Por defecto cargo-deny solo revisa advisories "unmaintained"/"unsound"
# en dependencias directas. Se amplía a todo el árbol (igual que
# cargo-audit) para no tener cobertura distinta entre ambas.
unmaintained = "all"
unsound = "all"
# Advisories "unmaintained"/"unsound" conocidas y aceptadas: son
# transitivas de tauri/wry (zbus, glib, chrono, proc-macro-error) y hoy
# no hay upgrade disponible desde este proyecto sin esperar a que tauri
# actualice sus propias dependencias. Revisar periódicamente si ya se
# puede quitar alguna de esta lista.
ignore = [
    { id = "RUSTSEC-2026-0543", reason = "chrono sin upgrade disponible; dependencia directa, revisar alternativas (jiff/time) a futuro" },
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error sin upgrade disponible; transitiva de tauri" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names sin upgrade disponible; transitiva de tauri-plugin-opener (zbus)" },
    { id = "RUSTSEC-2026-0370", reason = "zvariant sin upgrade disponible; transitiva de tauri-plugin-opener (zbus)" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive sin upgrade disponible; transitiva de tauri-plugin-opener (zbus)" },
    { id = "RUSTSEC-2024-0429", reason = "glib unsound sin upgrade disponible desde este proyecto; transitiva del backend GTK de tauri en Linux" },
]

[licenses]
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "0BSD",
    "Unlicense",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
]

[licenses.private]
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "deny"
workspace-default-features = "allow"
external-default-features = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
